services:
  app:
    container_name: metamcp
    # Local build (docker build -t metamcp:oauth-refresh .). Carries fixes that
    # are not upstream:
    #   - mcp-proxy/server.ts: the SseError-only 401 check missed
    #     STREAMABLE_HTTP, so OAuth-protected servers (sentry) could never
    #     complete the browser auth flow.
    #   - token-exchange.ts: SDK 1.29 carries the HTTP status on the error's
    #     `code`, not in its message, so an expired token was never classified
    #     as an auth failure and refresh-on-401 never ran.
    #   - client.ts: reload OAuth tokens from the DB on every connect (the pool
    #     cached a snapshot), and flag error_status when a remote server
    #     exhausts its connection attempts.
    image: metamcp:oauth-refresh
    env_file:
      - .env
    ports:
      - "12008:12008"
    environment:
      # Postgres connection details
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      
      # Database configuration (composed from above vars)
      DATABASE_URL: postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}
      
      # Application URL configuration
      APP_URL: ${APP_URL:-http://localhost:12008}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      
      # Auth configuration
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-super-secret-key-change-this-in-production}
      
      # Docker networking fix
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: ${TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL:-true}

      # Idle-session reaper. McpServerPool.cleanupExpiredSessions() runs every 5
      # minutes but returns early when getSessionLifetime() is null, which is the
      # default when neither this env var nor a SESSION_LIFETIME config row is set.
      # With it unset, a client that disconnects uncleanly leaves its active
      # session — and therefore a full set of backend stdio processes — pinned
      # forever; only maxConnectionsPerServer stops it growing without bound.
      #
      # This is an IDLE timeout, not a hard TTL: getSession() touches the session
      # timestamp on every access, so a session in active use never expires. A
      # session that is reaped recovers transparently — getSession() re-initialises
      # an unknown sessionId from the idle pool on the next call.
      SESSION_LIFETIME: ${SESSION_LIFETIME:-1800000} # 30 minutes, in milliseconds
      
      # ========================================================================
      # Bootstrap Configuration Examples
      # ========================================================================
      
      # Multiple Users - Define different users with different roles
      # BOOTSTRAP_USERS: |
      #   [
      #     {
      #       "email": "admin@company.com",
      #       "password": "admin-secure-password",
      #       "name": "System Administrator"
      #     },
      #     {
      #       "email": "developer@company.com",
      #       "password": "dev-secure-password",
      #       "name": "Lead Developer"
      #     },
      #     {
      #       "email": "analyst@company.com",
      #       "password": "analyst-secure-password",
      #       "name": "Data Analyst"
      #     }
      #   ]
      
      # API Keys - Assign keys to specific users using user_email
      # BOOTSTRAP_API_KEYS: |
      #   [
      #     {
      #       "name": "Admin Production Key",
      #       "is_public": false,
      #       "user_email": "admin@company.com"
      #     },
      #     {
      #       "name": "Developer Key",
      #       "is_public": false,
      #       "user_email": "developer@company.com"
      #     },
      #     {
      #       "name": "Analyst Key",
      #       "is_public": false,
      #       "user_email": "analyst@company.com"
      #     },
      #     {
      #       "name": "Public API Key",
      #       "is_public": true
      #     }
      #   ]
      
      # Namespaces - Create user-specific workspaces
      # BOOTSTRAP_NAMESPACES: |
      #   [
      #     {
      #       "name": "Admin Workspace",
      #       "description": "Administrator's private workspace",
      #       "is_public": false,
      #       "user_email": "admin@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "Development",
      #       "description": "Development environment",
      #       "is_public": false,
      #       "user_email": "developer@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "Analytics",
      #       "description": "Data analytics workspace",
      #       "is_public": false,
      #       "user_email": "analyst@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "Shared Resources",
      #       "description": "Public shared namespace",
      #       "is_public": true,
      #       "update": true
      #     }
      #   ]
      
      # Endpoints - Configure endpoints with different owners and auth settings
      # Note: Endpoints can optionally specify which namespace they should be created in
      # BOOTSTRAP_ENDPOINTS: |
      #   [
      #     {
      #       "name": "admin-api",
      #       "description": "Admin-only API endpoint",
      #       "namespace": "Production",
      #       "enable_auth": true,
      #       "enable_auth_query": false,
      #       "enable_auth_oauth": true,
      #       "is_public": false,
      #       "user_email": "admin@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "dev-api",
      #       "description": "Development API endpoint",
      #       "namespace": "Development",
      #       "enable_auth": true,
      #       "enable_auth_query": true,
      #       "enable_auth_oauth": false,
      #       "is_public": false,
      #       "user_email": "developer@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "analytics-api",
      #       "description": "Analytics API endpoint",
      #       "namespace": "Analytics",
      #       "enable_auth": true,
      #       "enable_auth_query": false,
      #       "enable_auth_oauth": false,
      #       "is_public": false,
      #       "user_email": "analyst@company.com",
      #       "update": true
      #     },
      #     {
      #       "name": "public-api",
      #       "description": "Public API endpoint - no auth required",
      #       "namespace": "Shared Resources",
      #       "enable_auth": false,
      #       "enable_auth_query": false,
      #       "enable_auth_oauth": false,
      #       "is_public": true,
      #       "update": true
      #     }
      #   ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Persist the uv cache across container recreates. Without this, every
      # `docker compose up -d`/recreate wipes the writable layer and the next
      # `uvx <pkg>@latest` spawn for each STDIO server cold-installs from
      # scratch — slow enough to trip the crash detector and stick the server
      # in error_status=ERROR. The image ships /home/nextjs/.cache/uv owned by
      # nextjs (uid 1001) so a fresh named volume inherits correct ownership.
      - uv_cache:/home/nextjs/.cache/uv
      # Same reasoning for npx: without this, every recreate re-downloads each
      # `npx -y <pkg>` server, and several racing cold installs against a fresh
      # _npx dir corrupt each other (TAR_ENTRY_ERROR / spawn ENOENT).
      - npm_cache:/home/nextjs/.npm
      # STDIO servers are spawned inside this container, so the host paths in
      # their commands have to resolve here too. Read-only, and scoped to the
      # directories that actually hold MCP server code — not all of $HOME.
      - /home/dev/.local/bin:/home/dev/.local/bin:ro
      - /home/dev/.local/share/mcp-servers:/home/dev/.local/share/mcp-servers:ro
      - /home/dev/.local/share/uv:/home/dev/.local/share/uv:ro
      - /home/dev/projects/dokploy-mcp-server:/home/dev/projects/dokploy-mcp-server:ro
      - /home/dev/projects/unifi-network-mcp:/home/dev/projects/unifi-network-mcp:ro
      # claude-design's launcher reads Claude Code's OAuth token from
      # $HOME/.claude/.credentials.json. Mounted at the container user's home so
      # node's homedir() resolves without overriding HOME (which would move the
      # npm cache off its volume). Host-side access is a POSIX ACL for uid 1001
      # only — the file stays 0600, no chmod.
      - /home/dev/.claude:/home/nextjs/.claude:ro
    networks:
      - metamcp-network

  postgres:
    image: postgres:16-alpine
    container_name: metamcp-pg
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-9433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metamcp-network

volumes:
  postgres_data:
    driver: local
  npm_cache:
    driver: local
  uv_cache:
    driver: local

networks:
  metamcp-network:
    driver: bridge
